# SonarCloud analysis scope, read by the SCANNER run in .github/workflows/ci.yml.
#
# This is the file in force once Automatic Analysis is switched off. It has to
# be a scanner run, because the rule-level ignores at the bottom are the whole
# point and autoscan has no file-based way to express them: it reads only
# .sonarcloud.properties, and only the scope keys from it.
#
# BOTH ANALYSIS METHODS CANNOT BE ON AT ONCE. SonarCloud rejects a CI analysis
# while Automatic Analysis is enabled. Turn it off under
# Administration > Analysis Method before expecting this to take effect.
#
# .sonarcloud.properties stays in the repo carrying the same exclusions, so
# that turning autoscan back on degrades to "correct scope, no rule ignores"
# instead of to nothing.
#
# Added because the quality gate was failing mostly on files that are not
# source: 20-odd "bugs" were missing <!DOCTYPE>, missing <title> and unlabelled
# <li> tags inside go/internal/siteprofile/testdata/*.html.
#
# Those files are CAPTURED EVIDENCE. They are real pages downloaded from
# Zoopla, Redfin, Paruvendu and the rest, kept byte-for-byte so a parser test
# asserts against what the site actually served. "Fixing" them would mean
# editing someone else's markup until it passed our linter, which would break
# every test that depends on them and destroy the only reason they exist.
#
# The same applies to docs/*.html: generated mockups and reports, not shipped
# UI. They are read once by a person and never served to a browser.
#
# Everything the project actually ships stays in scope, including the console's
# own HTML, CSS and JavaScript.

sonar.projectKey=yosrikhiari_Jester
sonar.organization=yosrikhiari

# WHY THIS LINE EXISTS, and it is not cosmetic.
#
# The project's New Code definition is "previous version", and no analysis had
# ever carried a version - eighteen of them recorded `projectVersion: "not
# provided"`. With no previous version to compare against, SonarCloud treats
# the WHOLE REPOSITORY as new code. That is why a Go test file written months
# ago turned up as a new-code security finding, and why new_coverage (50.8%)
# came out within three points of total coverage (53.5%): they were measuring
# the same thing.
#
# A gate whose "new code" means "all code" is not measuring what it claims.
# Naming a version gives it a baseline: this analysis becomes the reference,
# and later ones report on what changed since.
#
# Keep in step with python/pyproject.toml. Bumping it here starts a new
# period, which is the point - do it when you would cut a release, not to
# make a number move.
sonar.projectVersion=0.1.0

sonar.sources=python/jester,go,config,docker
sonar.tests=python/tests
sonar.python.version=3.11

# Coverage. The gate wants 80% on new code, and with no report uploaded it
# reads 0% rather than "unknown" - so a missing file fails the build in a way
# that looks like the tests stopped covering anything.
#
# Both files are produced by the test jobs and travel to the scanner job as
# artifacts; see .github/workflows/ci.yml.
sonar.python.coverage.reportPaths=coverage.xml
sonar.go.coverage.reportPaths=go/coverage.out

# Captured pages from real sites, kept verbatim as parser fixtures.
sonar.exclusions=\
  **/testdata/**,\
  **/node_modules/**,\
  frontend/**,\
  docs/**/*.html,\
  data/**,\
  plans/**

# Test code is analysed, but the rules that make sense for a test are not the
# rules that make sense for a library. A composite assertion is a readability
# preference; a test that needs splitting into six is not obviously better.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5906
sonar.issue.ignore.multicriteria.e1.resourceKey=python/tests/**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5754
sonar.issue.ignore.multicriteria.e2.resourceKey=python/tests/**/*.py

# python:S5332 "using HTTP is insecure". Nothing here OPENS an http
# connection. All three hits are the literal string being used the other way
# round - to recognise or to print:
#   identify.py   `_HTTP = ("http://", "https://")`, the prefix tuple that
#                 decides whether a stored source_url is a URL at all.
#                 Dropping "http://" would not make anything safer; it would
#                 make the classifier blind to rows already in the archive.
#   sources.py    keeps the scheme the operator actually pasted. It defaults
#                 to https and only preserves http when they typed it.
#   server.py     prints "http://127.0.0.1:8619/" so the operator can click
#                 it. That is the address the local console genuinely serves.
# Outbound fetching lives in jester/sources.py and the Go worker, and is
# https throughout.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=python/jester/identify.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e4.resourceKey=python/jester/sources.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=python/jester/console/server.py

# docker:S6471 "the image runs as root". The frontend image no longer does -
# it was given a USER, and that one was a real finding. These two cannot be,
# and the reason is in each Dockerfile:
#   Dockerfile.python  runs the cron daemon so the Schedule tab's registered
#                      job actually fires. cron owns /var/spool/cron/crontabs
#                      at mode 1730 and will not start without it, so a
#                      non-root console turns the scheduler into a feature
#                      that silently never runs.
#   go.Dockerfile      shares one SQLite database with that console through a
#                      volume. That shared queue IS the cross-process
#                      contract; two uids writing one file breaks it quietly.
# Reviewed and accepted rather than unnoticed. If cron is ever replaced by an
# external scheduler, both of these should drop to a non-root user together.
sonar.issue.ignore.multicriteria.e6.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e6.resourceKey=docker/Dockerfile.python
sonar.issue.ignore.multicriteria.e7.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e7.resourceKey=docker/go.Dockerfile

# go:S5332 "using HTTP is insecure", every hit inside a Go _test.go file.
# They are httptest servers: the test starts a listener on 127.0.0.1 and the
# URL it hands back is http:// because that is what httptest.NewServer serves.
# Requiring TLS there would mean generating a certificate so that a loopback
# request to a server the test just started could be encrypted against itself.
#
# Scoped to test files only. The same rule still applies to everything that
# ships, which is where it belongs - and where identify.py was actually fixed
# rather than ignored.
sonar.issue.ignore.multicriteria.e8.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*_test.go
