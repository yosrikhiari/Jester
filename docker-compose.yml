# M1.1 live-ingestion stack — mirrors jester-setup.md §4.3.2 (v3.11-corrected).
services:
  cloakbrowser:
    image: cloakhq/cloakbrowser
    command: cloakserve --idle-timeout=300
    restart: unless-stopped
    shm_size: "2gb"                # Chromium needs real /dev/shm, not Docker's tiny default
    ports:
      - "127.0.0.1:9222:9222"      # CDP endpoint — localhost only, never expose publicly
    volumes:
      - cloak_profiles:/profile    # persistent fingerprint/cookie profile per source
    environment:
      - CLOAKBROWSER_LICENSE_KEY=${CLOAKBROWSER_LICENSE_KEY:-}   # empty = free tier, 1 concurrent session
      - CLOAKBROWSER_PROXY=${CLOAKBROWSER_PROXY:-}
      - CLOAKBROWSER_GEOIP=${CLOAKBROWSER_GEOIP:-us}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  cloak_profiles:
  qdrant_storage:
