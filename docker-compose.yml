# Jester — full local stack for `docker compose up`.
#
# Default (`docker compose up`) brings up everything that is pure local code
# and needs no external account or model download:
#   - qdrant            vector store
#   - jester-console    Python operator console (serves the UI + /api) on :8619
#   - go-worker         Go ingestion worker (mock enqueue) — stays up for exec
#   - frontend          React/Vite dev server on :5173
#
# The two services that need external resources are behind a `live` profile,
# so they don't block a plain `up`:
#   docker compose --profile live up        # adds cloakbrowser + ollama
#
# All code is bind-mounted from the repo, so edits are picked up without a
# rebuild (Python/Go console + CLI; the Go binary is built once into the
# image, the React dev server hot-reloads).
#
# go-worker and jester-console share one SQLite database through the handoff
# queue — that IS the cross-process contract, so both must see the same data
# directory. They share the `jester_docker_data` VOLUME, not the host's ./data.
#
# That separation is deliberate and load-bearing. This stack runs every
# provider as `fake` (JESTER_MOCK=1 plus the thresholds override below) and
# starts cron inside the console container, so it generates stand-in
# extractions on a schedule. Pointed at the host's ./data it would write those
# into the real archive, where `extractor_model` exists specifically to keep
# them out — and it would do so as a THIRD writer of a SQLite file whose other
# writers are the host CLI and the scheduled tasks. SQLite's locking is not
# reliable across a Docker bind mount, and on 2026-08-28 that combination
# corrupted ingest_batch mid-ingest ("database disk image is malformed").
#
# To inspect the real archive, run the console on the host instead:
#   python -m jester.console --db data/jester.db --config config

name: jester

services:
  qdrant:
    # F-07: pinned 2026-10-29 through the Docker Hub registry HTTP API —
    # token from auth.docker.io, then GET
    # registry-1.docker.io/v2/qdrant/qdrant/manifests/latest, whose
    # Docker-Content-Digest header matched the Hub's tag digest. `latest`
    # stays as the tag because Dependabot updates only references that carry
    # a runnable tag; the digest is what actually runs.
    image: qdrant/qdrant:latest@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    # Loopback-only, like ClickHouse: Qdrant ships without authentication, so
    # publishing it on every interface puts the vectors on the LAN. In-network
    # callers (console, Go worker) still reach it as qdrant:6333.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    # The qdrant image ships no curl/wget, so a HTTP healthcheck isn't
    # available without rebuilding it. Downstream services depend on
    # `service_started` instead; qdrant listens within ~1s of start.
    # Same policy as clickhouse and cloakbrowser. Without it, every Docker or
    # machine restart brought the rest of the stack back and left qdrant
    # exited, and the scheduled treat runs reported "dedup down" for hours
    # (2026-10-01: exited at ~07:50, noticed at 14:50).
    restart: unless-stopped
    networks: [jester_net]

  jester-console:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    # Code bind-mounted from the repo; only pip deps are baked in.
    volumes:
      - .:/app
      # Shadows the repo's ./data inside the container: this stack gets its own
      # throwaway archive and never touches the host's. See the header.
      - jester_docker_data:/app/data
      # Force every provider to `fake` so the stack runs fully offline.
      - ./docker/config/thresholds.yaml:/app/config/thresholds.yaml:ro
    environment:
      JESTER_MOCK: "1"
      JESTER_QDRANT_URL: http://qdrant:6333
      # Service names, not 127.0.0.1. The repo's config/scraper.yaml is
      # bind-mounted in here and says 127.0.0.1:9222, which is correct for a
      # worker running ON the host and wrong inside a container, where it is
      # this container's own loopback. cloakserve then reads as down while it
      # is up and answering on this network, and the console switches off the
      # live-ingest button that gates on it.
      #
      # OLLAMA_HOST is the variable ollama.Client() itself reads, so the
      # health panel and the code it describes cannot disagree.
      JESTER_CDP_URL: http://cloakbrowser:9222
      # The host's Ollama, not the compose one. The compose `ollama` service
      # sits behind the `live` profile and is usually not running, while the
      # machine itself has Ollama up with the models already pulled
      # (nomic-embed-text and friends). Probing a service that is not there
      # reported "Ollama down" on a machine where Ollama was answering.
      #
      # host.docker.internal needs the extra_hosts line below: it does not
      # resolve inside these containers on its own, which is why the first
      # attempt at this still could not reach it.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    # The container still listens on 0.0.0.0 (Dockerfile CMD), but the host
    # side is loopback: the token guards POSTs, this keeps GETs off the LAN.
    ports:
      - "127.0.0.1:8619:8619"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8619/api/doctor'); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [jester_net]

  go-worker:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    volumes:
      - .:/app
      # Same throwaway archive the console uses — the handoff queue is the
      # contract between these two, and only these two.
      - jester_docker_data:/app/data
    environment:
      JESTER_MOCK: "1"
      JESTER_QDRANT_URL: http://qdrant:6333
      # Service names, not 127.0.0.1. The repo's config/scraper.yaml is
      # bind-mounted in here and says 127.0.0.1:9222, which is correct for a
      # worker running ON the host and wrong inside a container, where it is
      # this container's own loopback. cloakserve then reads as down while it
      # is up and answering on this network, and the console switches off the
      # live-ingest button that gates on it.
      #
      # OLLAMA_HOST is the variable ollama.Client() itself reads, so the
      # health panel and the code it describes cannot disagree.
      JESTER_CDP_URL: http://cloakbrowser:9222
      # The host's Ollama, not the compose one. The compose `ollama` service
      # sits behind the `live` profile and is usually not running, while the
      # machine itself has Ollama up with the models already pulled
      # (nomic-embed-text and friends). Probing a service that is not there
      # reported "Ollama down" on a machine where Ollama was answering.
      #
      # host.docker.internal needs the extra_hosts line below: it does not
      # resolve inside these containers on its own, which is why the first
      # attempt at this still could not reach it.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_started
    networks: [jester_net]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    volumes:
      - ./frontend:/app
      # Keep installed node_modules out of the bind mount.
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    networks: [jester_net]

  # ---- profile-gated: need external resources -----------------------------
  cloakbrowser:
    # F-07: this used to be UNTAGGED — Docker resolved it to whatever was
    # pushed last, and Dependabot ignores untagged references entirely,
    # immune to the weekly schedule above. Pinned 2026-10-29 to 0.6.4, the
    # newest stable release tag (tag list and push dates from the Docker Hub
    # v2 repositories/cloakhq/cloakbrowser/tags endpoint: latest and 0.6.4
    # were both pushed 2026-10-23 and share this digest), verified against
    # the registry manifest API like the rest.
    image: cloakhq/cloakbrowser:0.6.4@sha256:9e08a8f391d322810b72315fb06a102d98d51071767330ef381c4bc05626b5a6
    command: cloakserve --idle-timeout=300
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "127.0.0.1:9222:9222"
    volumes:
      - cloak_profiles:/profile
      # Mounted where cloakserve actually caches its Chromium, so the download
      # survives a restart. It used to be /chrome-dir with
      # CLOAKBROWSER_BINARY_PATH pointing into it, and that combination cannot
      # work: ensure_binary() treats an explicit BINARY_PATH as "this file is
      # already here" and raises FileNotFoundError rather than downloading, so
      # the container sat in a restart loop against an empty volume.
      - cloak_browser_binary:/root/.cloakbrowser
    environment:
      # No BINARY_PATH and no version pin: cloakserve fetches the free binary
      # itself (v146 at time of writing, v150 also free with one concurrent
      # session). The plan's CLOAKBROWSER_VERSION=v146 is rejected by the
      # current image, which wants a full Chromium version like
      # 148.0.7778.215.2 - so pinning nothing is what actually works.
      - CLOAKBROWSER_LICENSE_KEY=${CLOAKBROWSER_LICENSE_KEY:-}
      - CLOAKBROWSER_PROXY=${CLOAKBROWSER_PROXY:-}
      - CLOAKBROWSER_GEOIP=${CLOAKBROWSER_GEOIP:-}
    healthcheck:
      # curl, not wget: this image ships curl and has no wget, so the old
      # probe exited 127 (command not found) on every tick and the container
      # reported unhealthy for its whole life while answering CDP perfectly.
      # 127.0.0.1 rather than localhost for the usual reason - the endpoint is
      # IPv4-only and localhost resolves to ::1 first.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["live"]
    networks: [jester_net]

  # the collector's queryable store. Profile-gated like the other externals: the
  # nugget pipeline does not need it, and a service nobody asked for should
  # not start with `docker compose up`.
  #
  # Only the HTTP interface is published. The native protocol would want 9000,
  # which is already taken on this machine, and the loader speaks HTTP over
  # stdlib urllib rather than pulling in a driver - the same call the repo
  # already makes for Groq and Ollama.
  clickhouse:
    # F-07: pinned 2026-10-29 through the registry manifest API. The tag
    # stays 24.8-alpine — what the signals loader targets — and now carries
    # its digest, so a republished tag pulls different bytes no longer.
    image: clickhouse/clickhouse-server:24.8-alpine@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      - CLICKHOUSE_DB=jester
      - CLICKHOUSE_USER=jester
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-jester}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      # 127.0.0.1, not localhost. The server listens on IPv4 only and
      # `localhost` resolves to ::1 first inside this image, so the check gets
      # connection refused against a container that is answering perfectly -
      # the same trap config/scraper.yaml documents for the CDP endpoint.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["signals"]
    networks: [jester_net]

  ollama:
    # F-07: pinned 2026-10-29 through the registry manifest API (`latest`
    # pushed 2026-10-29 itself). Tag kept for Dependabot; digest decides.
    image: ollama/ollama:latest@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    # No authentication and no host-side consumer beyond this machine; a
    # published Ollama is an open model server.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["live"]
    networks: [jester_net]

volumes:
  jester_docker_data:
  qdrant_storage:
  clickhouse_data:
  cloak_profiles:
  ollama_data:
  cloak_browser_binary:

networks:
  jester_net:
    driver: bridge
