# CI for a two-language repo that had none.
#
# 14,587 lines across Go and Python with 526 Python tests and a full Go suite,
# all of which ran only when somebody remembered. This runs both on every push
# and pull request.
#
# Deliberately NOT running the live-network tests: internal/reddit and
# internal/youtube reach real sites through a cloakserve container that does
# not exist on a runner, and hackernews/discourse hit live public APIs. Those
# skip themselves when the endpoint is unreachable, but a CI job whose result
# depends on someone else's uptime teaches people to ignore red builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build
        working-directory: go
        run: go build ./...
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Test
        working-directory: go
        # -short is honoured by the live tests; they also self-skip when the
        # CDP endpoint is unreachable, which it is here.
        run: go test -short ./...
      - name: Formatting
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install
        run: pip install -r python/requirements.txt
      - name: Test
        working-directory: python
        env:
          # Force the offline providers so no test can reach a paid API, and
          # leave JESTER_QDRANT_URL unset so vectors go to a temp path rather
          # than a server that is not running.
          JESTER_MOCK: '1'
        run: python -m pytest -q

  contract:
    name: Cross-language contract
    runs-on: ubuntu-latest
    # The Go worker writes ingest_batch rows the Python pipeline reads. That
    # handoff is the one thing neither suite can check on its own.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install Python deps
        run: pip install -r python/requirements.txt
      - name: Create a Python-owned database
        run: |
          cd python
          PYTHONPATH=. python -c "
          from jester.store import open_db
          open_db('/tmp/contract.db').close()
          print('python created /tmp/contract.db')
          "
      - name: Go must be able to write to it
        working-directory: go
        env:
          JESTER_CONTRACT_DB: /tmp/contract.db
        run: go test ./internal/store/ -run Contract -v
