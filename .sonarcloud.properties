# SonarCloud AUTOMATIC ANALYSIS reads THIS file. It does not read
# sonar-project.properties — that one is for the scanner CLI, and a project on
# autoscan silently ignores it. Both files exist here on purpose, and the
# duplication is deliberate: whichever mode the project is in, the scope is
# the same. If autoscan is ever turned off in favour of a scanner job, this
# file stops being read and the other one takes over.
#
# WHAT IS EXCLUDED AND WHY
#
# go/internal/**/testdata/*.html is the big one: roughly forty of the reported
# "bugs" live there — missing <!DOCTYPE>, missing <title>, an <li> outside a
# list, a <td> with onmouseover and no onfocus.
#
# Those are not our pages. They are captured byte-for-byte from Zoopla,
# Redfin, Paruvendu, Mubawab, OnTheMarket and the rest, and kept exactly as
# served so a parser test asserts against what the site really sends. Fixing
# them would mean editing someone else's markup until it passed our linter,
# which breaks every test that depends on them and destroys the only reason
# they exist. The accessibility findings are real — about those sites, not
# about this code.
#
# docs/**/*.html are generated mockups and reports. Read once by a person,
# never served to a browser.
#
# Everything the project actually ships stays in scope, including the
# console's own HTML, CSS and JavaScript.

sonar.sources=python/jester,go,config,docker
sonar.tests=python/tests

sonar.exclusions=**/testdata/**,**/node_modules/**,frontend/**,docs/**/*.html,data/**,plans/**
