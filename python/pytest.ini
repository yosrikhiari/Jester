[pytest]
markers =
    live_ollama: hits a running Ollama daemon (§37.16); deselected by default, run with -m live_ollama
    live_qdrant: hits a running Qdrant server (§37.17); deselected by default, run with -m live_qdrant
    live_cloak: scrapes real Reddit through cloakserve (§37.19); opt-in, run with -m live_cloak
    live_youtube: scrapes real YouTube through cloakserve (§37.25); opt-in, run with -m live_youtube
addopts = -m "not live_ollama and not live_qdrant and not live_cloak and not live_youtube"
