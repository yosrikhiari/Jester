[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jester"
version = "0.1.0"
description = "Jester intelligence agents: scraping, real-estate listings, property analytics."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "qdrant-client>=1.10",
    "pytest>=8.0",
    "tzdata>=2024.1",
    "ollama>=0.4",
]

[project.scripts]
jester = "jester.cli:main"

# Test and coverage tooling lives here, not in `dependencies` above, so a
# plain `pip install jester` does not ship the suite. CI and Docker install
# from pylock.toml (the PINNED lock); the runtime `dependencies` list is due
# to drop pytest once the lock is regenerated on Linux (F-08 follow-up).
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = ["jester", "jester.agents", "jester.console", "jester.chat", "jester.signals", "jester.journal", "jester.fetchers"]
