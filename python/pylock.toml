# PEP 751 lock file for the Python side, generated by `pip lock`.
#
# THIS LOCK IS FOR LINUX. It is generated inside python:3.12-slim and pins the
# exact wheel for each package, and some of those wheels are platform-specific
# — grpcio is the one that bites. On Windows `pip install -r pylock.toml` fails
# with "No wheel found matching the provided tags for package 'grpcio'", which
# names the package and not the reason.
#
# That is not a bug to route around, it is what the file is for: the Docker
# images and CI are Linux, and this pins what they install down to the byte.
# `pip lock` has no --platform flag, so one file cannot cover both.
#
# For local development on Windows or macOS, install requirements.txt, which
# states the constraints rather than the resolution.
#
#   pip install -r python/requirements.txt
#
# requirements.txt says what we DEPEND on (">=6.0" — the oldest PyYAML that
# works). This says what Linux last RESOLVED, down to the wheel and its
# sha256, so a rebuild next March installs the bytes that were tested today.
#
# Regenerate deliberately, never casually:
#   docker run --rm -i python:3.12-slim sh -c #     'cat > /r.txt; pip install -q -U pip; pip lock -q -r /r.txt -o /dev/stdout' #     < python/requirements.txt > python/pylock.toml
# then re-add this header, rebuild, and run the suite before committing.
#
# Every entry below is a wheel. Nothing here needs a source build, which is
# what lets Dockerfile.python pass --only-binary :all: and refuse to execute
# a setup.py at install time.

lock-version = "1.0"
created-by = "pip"

