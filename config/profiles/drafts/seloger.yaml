# DRAFT - NOT A LIVE PROFILE. Held in drafts/ so the *.yaml glob in
# config/profiles/ does not pick it up.
#
# WHAT IS MISSING. Every other profile names the fields it reads. This one has
# a data_path and nothing else, so Parse would walk a full page of results,
# find no listing_id on any record, drop all of them, and report the portal as
# empty. siteprofile.Validate now rejects that shape rather than letting it run.
#
# THE data_path IS ALSO UNVERIFIED. It is the first of seven candidates in
# test_seloger.py (a one-off script, removed from the repo root 2026-09-24 -
# see git history), which rewrote this file in a loop and fired the
# live worker at seloger.com to see which one sticks. Nothing in the repo
# records that any of them did. (That script is also why this file has no
# header comment and is in alphabetical order - it was written back by
# yaml.dump, which drops comments.)
#
# TO FINISH IT, per docs/plans/2026-08-31-real-estate-intelligence.md, where
# tasks FR-2.1 through FR-2.4 are all still unchecked:
#   1. Capture one real result page and save it as
#      go/internal/siteprofile/testdata/seloger_listings.html.
#   2. Read the actual __NEXT_DATA__ shape out of that fixture to settle
#      data_path - from the file, not by probing production.
#   3. Add fields (listing_id is mandatory), gallery, and url_template.
#   4. Add a Go test against the fixture, move this file up to
#      config/profiles/, and set enabled: true in config/sources.yaml.

base_url: https://www.seloger.com
currency: EUR
extract:
  data_path: props.pageProps.searchResults.properties
  mode: nextdata
list:
  max_pages: 5
  page_param: page
  url: https://www.seloger.com/listing/parametric
market: fr
observation:
  kind: listing
portal: seloger
