# Mubawab Tunisia (Tunisia) - real-estate-focused platform
# Probed 2026-09-02: JSF/PrimeFaces, 33 listings on first page
# Anchor is adid="1234567" (fav icon), block starts at priceBar container
portal: mubawab
market: tn
base_url: https://www.mubawab.tn
currency: TND
# Verified 2026-09-04: the result page and its data-adid tiles are served in
# full to an ordinary GET.
# Re-probed 2026-11-05 (after realestate-revive-1 graded price 0/1130): the
# page is still served whole (65 adid leaves), but the PRICE markup moved from
# plain tile text into a <bdi dir="ltr"> wrapper inside the priceTag span, and
# the photo carousel moved to data-lazy="…" (.avif). Both encoded below.
fetch: http

list:
  url: https://www.mubawab.tn/fr/ct/tunis/immobilier-a-vendre
  # Tunis is one governorate of many. Each city seed answers its own 33 tiles
  # per page and pages just as deep, so the seed list multiplies the reachable
  # inventory rather than merely lengthening it. Verified 2026-09-04: all six
  # return a full page.
  urls:
    - https://www.mubawab.tn/fr/ct/sousse/immobilier-a-vendre
    - https://www.mubawab.tn/fr/ct/sfax/immobilier-a-vendre
    - https://www.mubawab.tn/fr/ct/nabeul/immobilier-a-vendre
    - https://www.mubawab.tn/fr/ct/bizerte/immobilier-a-vendre
    - https://www.mubawab.tn/fr/ct/monastir/immobilier-a-vendre
    - https://www.mubawab.tn/fr/ct/ariana/immobilier-a-vendre
  # Mubawab pages by PATH, not by query: ":p:2" returns a set of adids
  # disjoint from page 1 (33 tiles each), while ?page=2 re-serves page one.
  # page_param cannot express a suffix, which is why page_template exists.
  page_template: "{url}:p:{page}"
  max_pages: 5

extract:
  mode: anchored
  anchor: 'adid="(?P<id>[^"]+)"'
  block_len: 8000
  block_start: '<div class="(?:listingBox|priceBar)'

  fields:
    listing_id:
      pattern: 'adid="([^"]+)"'
      transform: [trim]
    url:
      # /fr/a/ is the shape a result tile actually links to; the profile
      # matched only /fr/pa/ and /fr/ct/, so 110 of 132 listings came back
      # with no URL at all.
      pattern: 'href="(https://www\.mubawab\.tn/fr/(?:a|pa)/[^"]+)"'
      transform: [absolute]
    title:
      pattern: 'class="[^"]*listingTit[^"]*"[^>]*>\s*(?:<a[^>]*>)?\s*([^<]{5,300})'
      transform: [unescape, trim, striptags]
    price:
      # 2026-11-05: the figure sits in a <bdi dir="ltr"> inside the priceTag
      # span ("…priceTag…><bdi dir="ltr">430 000</bdi> <span
      # class="priceCurrency">TND…"); the old bare-text pattern returned
      # nothing at all. The optional <bdi> keeps "Prix à consulter" tiles
      # readable (digits transform empty and the share notices them like
      # before), and tiles still emitting plain text keep parsing.
      pattern: 'priceTag[^>]*>\s*(?:<bdi[^>]*>\s*)?([^<]{4,40})'
      transform: [unescape, digits, trim]
    location:
      pattern: 'class="[^"]*(?:listingLoc|listingH3)[^"]*"[^>]*>(?:\s*<i[^>]*>.*?</i>)?\s*([^<]{2,100})\s*<'
      transform: [unescape, trim]
    surface:
      pattern: '([\d]{2,4})\s*m²'
      transform: [digits]
    rooms:
      pattern: 'class="[^"]*(?:pieceTag|adDetailFeature)[^"]*"[^>]*>.*?(\d+)'
      transform: [digits]
    property_type:
      pattern: 'class="[^"]*(?:typeTag|listingTit)[^"]*"[^>]*>(?:<a[^>]*>)?\s*([^<]{2,100})'
      transform: [unescape, trim]
    seller:
      pattern: 'class="[^"]*(?:agencyName|ownerName)[^"]*"[^>]*>([^<]{2,100})<'
      transform: [unescape, trim]
    seller_type:
      const: "agency"

  # Mubawab puts the deal in the slug: /fr/a/8376817/a-louer-s1-au-lac2 against
  # /fr/a/8409575/a-vendre-s3. The search URL is "immobilier-a-vendre", so sale
  # is the honest default, but rentals do appear in the results.
  classify:
    field: deal_type
    from: url
    default: sale
    rules:
      - value: rental
        match: ["louer", "location"]

  gallery:
    # 2026-11-05: the carousel now lazy-loads to data-lazy (data-src is gone);
    # the vertical slider keeps data-url. dedup key is the filename part - the
    # horizontal and vertical sliders publish the SAME photo at two sizes
    # under /h/ and /m/, and the same photo shares one filename, while the
    # ad id arrives in path chunks (…/ad/8/185/299F/…) that changed meaning
    # in the markup since the "ad/(\d+)/" key was written.
    pattern: '(?:data-src|data-lazy|data-url)="(https://www\.mubawab-media\.com/[^"]+)"'
    all: true
    dedup_by: '([a-zA-Z0-9._%~-]{10,})\.[a-z]{3,5}$'
