# Habitaclia (Spain) - Region Phase 3, reached through priority 2.
#
# WHY NOT IDEALISTA. Idealista is the plan's priority 1 for Spain and answers
# 403 to an ordinary GET; its sitemap 404s. Habitaclia answers 200, and no rule
# in its robots.txt touches the listing paths - checked 2026-09-04.
#
# 2026-11-05: the portal migrated to a Schibsted app shell. The *.htm list
# pages redirect to canonical /comprar/…/s or /alquiler/…/s searches whose
# shipped HTML contains NO tiles at all - the whole result set (29 items per
# page on the Madrid seeds) arrives inside
#
#   window.__INITIAL_PROPS__ = JSON.parse("{…}")
#
# so the profile switched to nextdata mode; siteprofile.go was taught that
# wrapper the same day. Only one <script type="application/ld+json"> remains
# on the page and it is a BreadcrumbList (not listings).
portal: habitaclia
market: es
base_url: https://www.habitaclia.com
currency: EUR
# Verified 2026-11-05: canonical seed URLs below answer 200 to a plain GET
# with the app-state JSON aboard; ?page=N is honoured (?pagina=, -2 and
# /p/2 all re-serve page one or 404). Rental transcripts carry
# transaction.type "rent", sales "buy".
fetch: http

list:
  url: https://www.habitaclia.com/comprar/viviendas/madrid-provincia/madrid-capital/s
  # One region + five big-city purchases plus the Madrid lettings seed, the
  # same coverage the 2026-09 *.htm seeds reached through redirects.
  urls:
    - https://www.habitaclia.com/comprar/viviendas/barcelona-provincia/barcelona-capital/s
    - https://www.habitaclia.com/comprar/viviendas/valencia-provincia/valencia-capital/s
    - https://www.habitaclia.com/comprar/viviendas/sevilla-provincia/sevilla-capital/s
    - https://www.habitaclia.com/comprar/viviendas/malaga-provincia/malaga-capital/s
    - https://www.habitaclia.com/alquiler/viviendas/madrid-provincia/madrid-capital/s
  page_param: page
  max_pages: 5

extract:
  mode: nextdata
  data_path: initialSearchResultsPage.initialSearchContext.results.items

  fields:
    # legacyNumericId is the stable numeric id the .*htm theme published as
    # data-id; the item's own "id" is a mutable uuid.
    listing_id:
      path: legacyNumericId
      transform: [trim]
    url:
      # relative path shape /comprar/…/<uuid>/d - absolute builds
      # https://www.habitaclia.com/comprar/…
      path: urls.canonical
      transform: [absolute]
    title:
      path: summary.title
      transform: [trim, striptags]
    price:
      # {"amount": 1650000, "currency": null, "hidden": false, ...}
      path: transaction.price.amount
      transform: [digits]
    surface:
      path: property.builtSurface
      transform: [digits]
    rooms:
      path: property.rooms
      transform: [digits]
    bedrooms:
      path: property.rooms
      transform: [digits]
    property_type:
      path: property.propertySubtype
      transform: [trim]
    location:
      path: summary.location.municipality
      transform: [trim]
    city:
      path: summary.location.municipality
      transform: [trim]
    transaction:
      path: transaction.type
      transform: [trim]

  # The transaction type is stated outright: "buy" on the comprar seeds,
  # "rent" on the alquiler seed, and the seed list carries both - so deal
  # types keep discriminating per record.
  classify:
    field: deal_type
    from: transaction
    default: sale
    rules:
      - value: rental
        match: ["rent"]

  # summary.multimedia.images is a list of {type, url, position}; .url is the
  # photographic host (static.fotocasa.es). 29/29 sampled items carry images.
  gallery:
    path: summary.multimedia.images.url
