# Bayut (UAE) - Gulf real-estate portal, dominant in the Emirates.
# Probed 2026-09-05: bot challenge on plain GET returns "Security check | Bayut"
# with a JS challenge; tiles render only after the challenge completes.
# The rendered page carries rich schema.org LD+JSON with RealEstateListing
# objects inside an ItemList, each wrapping the property as mainEntity with
# bedrooms, bathrooms, price, floorSize, address and images.
# robots.txt allows /for-sale/ and /to-rent/; disallows /search/, /api/ (except
# /api/transactions and /api/propertyPrices/), /account, and city landing pages.
portal: bayut
market: ae
base_url: https://www.bayut.com
currency: AED
# A plain GET returns the JS challenge page, not listings. The rendered page
# carries RealEstateListing LD+JSON — ldjson mode extracts from that rather
# than scraping HTML tiles.
fetch: browser

list:
  url: https://www.bayut.com/for-sale/property/dubai/
  urls:
    - https://www.bayut.com/for-sale/property/dubai/
    - https://www.bayut.com/for-sale/property/abu-dhabi/
    - https://www.bayut.com/for-sale/property/sharjah/
    - https://www.bayut.com/for-sale/property/ajman/
    - https://www.bayut.com/for-sale/property/ras-al-khaimah/
  page_param: page
  max_pages: 3

extract:
  mode: ldjson
  type: RealEstateListing

  fields:
    listing_id:
      path: url
      pattern: '/details-(\d+)\.html'
    url:
      path: url
    title:
      path: mainEntity.description
      transform: [trim]
    price:
      path: mainEntity.price
      transform: [digits]
    currency:
      path: mainEntity.priceCurrency
    property_type:
      path: mainEntity.accommodationCategory
      transform: [trim]
    bedrooms:
      path: mainEntity.numberOfBedrooms
    bathrooms:
      path: mainEntity.numberOfBathroomsTotal
    surface:
      path: mainEntity.floorSize.value
      transform: [digits]
    location:
      path: mainEntity.address.addressLocality
      transform: [trim]
    city:
      path: mainEntity.address.addressRegion
      transform: [trim]

  classify:
    field: deal_type
    from: url
    default: sale
    rules:
      - value: rental
        match: ["/to-rent/"]

  gallery:
    path: mainEntity.image
