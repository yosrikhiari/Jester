# Hiring-advert rules — does this company want the thing we sell?
#
# A second rule set, not a second engine. The families, weights, roles and
# thresholds are read by exactly the same classifier as signal_rules.yaml,
# because the machinery was never specific to forum posts — it scores text
# against combinations of phrases, and that is all this needs.
#
# WHY A SEPARATE FILE
# -------------------
# The other rule set asks "is this person describing work software could
# remove?". That question is wrong here. A hiring advert is not describing a
# problem; it is announcing a decision already taken, with a budget attached.
# So the question becomes "does this company want the engagement we offer, for
# the kind of work we do?" - and the evidence is the advert's own structure.
#
# Scoring a job post with the forum rules would reject nearly all of them
# (an advert has no "owner voice", it has a company name) and accept the wrong
# ones (a recruiter's boilerplate is full of pain language).
#
# THE TWO HALVES, same shape as the other file
# --------------------------------------------
#   buyer        - wants a CONTRACT-shaped engagement AND our kind of work.
#                  This is what outreach can act on.
#   practitioner - wants our kind of work but only as a full-time employee.
#                  Real information about who is spending on what, and not a
#                  lead for an offer built around fractional engineers.
#   none         - neither, or actively disqualifying.
#
# MEASURED, not assumed: on the September 2026 thread, 258 adverts, 24 asking
# for contract or part-time work, 19 of those also naming AI, automation,
# integration or internal tooling. A regex found those numbers; this file is
# how they get re-measured properly, and the result may be lower.

config_version: 1

scope:
  status: provisional
  decided_by: ""
  decided_on: ""

  communities:
    - name: hn/hiring
      serves: buyer
      evidence: "measured - Sep 2026 thread: 258 adverts, 24 contract/part-time, 19 of those in our kind of work (7.4%). Fourteen consecutive monthly threads, 6,649 adverts, never below 379."
      why: companies publicly stating a need, a budget and a contact route
    - name: hn/hiring-fulltime
      serves: practitioner
      evidence: "the full-time majority of the same threads; who is spending on what, not a lead"
      why: market evidence for content, explicitly not outreach

  excluded:
    - name: "Ask HN: Freelancer? Seeking freelancer?"
      evidence: "measured - the September 2026 thread is 23 of 23 SEEKING WORK. The marketplace is entirely one-sided: freelancers advertising to freelancers."

  queries:
    - "12"

  retention:
    excerpt_chars: 600
    keep_full_text: false
    identities: "the company names itself in its own advert; nothing is enriched and nobody is contacted"
    removal: "recorded, not deleted"

# A buyer must clear both bars. An advert offering contract work in a field we
# do not touch is not a lead, and neither is a perfect technical match that
# only wants a full-time employee in an office.
buyer_at: 0.55
practitioner_at: 0.30
ambiguous_margin: 0.15
# Inheritance is meaningless here - every record is a top-level advert with no
# parent to borrow a voice from - so it is set to zero rather than left to
# fire on something unexpected.
inherited_weight: 0.0
inherited_max_chars: 1
max_reasons: 3

families:

  engagement:
    weight: 0.45
    role: buyer_required
    note: >
      The shape of the deal. A buyer signal REQUIRES one of these: the offer is
      an engineer inside the client's team, and a company that will only take a
      full-time employee on its own payroll is not buying that, however well
      the work matches.
    phrases: ["contract", "contractor", "contract to permanent", "contract-to-hire",
              "freelance", "freelancer", "part-time", "part time", "fractional",
              # Bare "consulting"/"consultant" is out: it matched "Black Canyon
              # Consulting", the company's NAME, and scored the advert 1.00.
              # Only the forms that describe an arrangement survive.
              "consulting basis", "consulting engagement", "as a consultant",
              "consulting contract", "hourly", "per hour", "/hr", "hrs/wk",
              "hours per week", "hours/week", "short-term", "project-based",
              "statement of work", "b2b contract", "1099 contractor",
              "1099 basis", "day rate"]

  our_work:
    weight: 0.35
    role: pain_marker
    note: >
      Engineering work we can do - which is nearly all of it, because the offer
      is "an engineer in the client's team" and not "an AI consultancy".

      This family was originally scoped to AI, automation and integrations,
      and that was the offer described too narrowly. It rejected ODK's
      "Senior Product Manager | Remote | Long-term contract, 30-40 hrs/week |
      $90-110/hr" and Lopaka's "Embedded UI | REMOTE | Contract | Part-time |
      $80-140/hr" for "never says what work it needs done" - two of the
      clearest leads in the sample - because neither said the word "AI".
      Nine of seventeen rejected contract-and-remote adverts failed this way.

      So it now covers engineering broadly. That does not make the rules
      permissive: `engagement` is still required, and wrong_discipline,
      onsite_only, employment_only and the hard rejects still carry the weight
      of saying no. What changed is that a contract role stops being rejected
      for using a different stack.
    phrases: ["engineer", "engineering", "developer", "development", "programmer",
              "software", "architect", "technical lead", "tech lead", "cto",
              "product manager", "product engineer", "sre", "devops",
              "ai", "llm", "genai", "machine learning", "automation", "automate",
              "workflow", "integration", "integrations", "api", "internal tool",
              "internal tools", "internal platform", "data pipeline", "etl",
              "scraping", "agent", "agents", "rag", "back office", "no-code",
              "low-code", "zapier", "n8n", "airtable",
              "python", "typescript", "javascript", "node", "react", "go",
              "golang", "rust", "java", "ruby", "rails", "php", "elixir",
              "flutter", "dart", "swift", "kotlin", "unity", "c++", "c#",
              "full-stack", "fullstack", "frontend", "front-end", "backend",
              "back-end", "mobile", "ios", "android", "platform", "infrastructure",
              "kubernetes", "aws", "gcp", "azure", "postgres", "database",
              "graphics", "embedded", "firmware engineer", "security engineer",
              "data engineer", "qa", "testing"]

  budget:
    weight: 0.20
    role: buyer_boost
    note: >
      A stated rate is the difference between a wish and a decision. It does
      not make a buyer on its own - plenty of full-time adverts post salary
      bands - but it raises confidence in one.
    phrases: ["$", "usd", "eur", "gbp", "£", "€", "salary", "rate", "compensation",
              "equity", "k-", "per year", "annually"]

  urgency:
    weight: 0.10
    role: buyer_boost
    note: "a start date is a decision with a clock on it"
    phrases: ["start by", "start asap", "immediate", "immediately", "urgent",
              "this month", "next month", "asap"]

  # -- negatives -------------------------------------------------------------
  onsite_only:
    weight: -0.65
    role: negative
    note: >
      A role that must be performed in an office in another country cannot be
      filled by a remote engineer, whatever the engagement says. "Hybrid" is
      included: it still requires being in the city.
    phrases: ["onsite only", "on-site only", "on-site", "onsite", "on site",
              "no remote", "not remote", "must be local", "in-office",
              "in office", "in-person", "hybrid", "relocation required",
              "must relocate", "must be based in", "based in our"]

  seller_voice:
    weight: -0.65
    role: negative
    note: >
      The author is the one being hired. In Reddit's hiring rooms these read
      almost exactly like a client advert - named work, a stated rate, first
      person - and the only difference is which side of the deal the "I" is
      on. One scored 1.00 as a buyer:

        "Eight years building embedded ML, finally putting myself out there
         ... I'm now looking for edge AI and TinyML contract roles, remote."

      Every phrase here describes the author's OWN availability. A company
      advertising a vacancy has no reason to write any of them, which is what
      keeps this from catching real adverts: a client says "we are looking
      for a developer", never "I am looking for work".

      Deliberately NOT here: bare "looking for", which is exactly what a
      client writes; and "years of experience", which adverts demand of
      candidates all the time.
    phrases: ["putting myself out there", "open to work", "open to opportunities",
              "open to new opportunities", "available for hire",
              "available for work", "i'm available", "i am available",
              "hire me", "my resume", "my cv", "my portfolio",
              "looking for work", "looking for a job", "looking for a role",
              "looking for roles", "looking for contract roles",
              "looking for contract work", "looking for freelance work",
              "looking for remote work", "looking for my next",
              "seeking contract roles", "seeking a role", "seeking roles",
              "seeking opportunities", "i'm looking for edge",
              "portfolio:", "resume:", "cv:",
              # HN's "Who wants to be hired?" template, which arrives in the
              # same collector as "Who is hiring?" and reads as a buyer
              # because it names the work, the stack and a location. Three of
              # 153 hn/hiring buyers were candidates filling this in.
              # Weighted rather than hard-rejected: an advert that offers to
              # relocate the right candidate is a real advert, and should be
              # able to survive on the rest of its evidence.
              "willing to relocate", "remote: yes", "technologies:"]

  employment_only:
    weight: -0.40
    role: negative
    note: >
      The advert rules out the engagement explicitly. Distinct from simply not
      mentioning contract work, which `engagement` already handles by not
      firing at all.
    phrases: ["full-time only", "full time only", "no contractors",
              "no contract", "no agencies", "no freelancers", "no recruiters",
              "w2 only", "employees only", "direct hire only"]

  visa_bound:
    weight: -0.30
    role: negative
    note: "work authorisation in one country, which a remote engagement cannot satisfy"
    phrases: ["visa sponsorship", "work authorization required", "us citizens only",
              "security clearance", "must be authorized to work", "green card",
              "eu citizens only", "citizens only"]

  no_budget:
    weight: -0.50
    role: negative
    note: >
      Equity instead of money is not a client. Two adverts scored 1.00 on a
      perfect engagement line - "Fractional / Contract | Equity-only (2-5%)"
      and a co-founder search paying in equity - and neither has a budget to
      spend, which is the whole point of preferring hiring adverts to forum
      posts. A co-founder hunt is the same thing wearing a different title.
    phrases: ["equity only", "equity-only", "equity based", "equity-based",
              "co-founder", "cofounder", "founding partner", "sweat equity",
              "profit share", "rev share", "revenue share", "unpaid",
              "deferred compensation", "no cash"]

  wrong_discipline:
    weight: -0.35
    role: negative
    note: >
      Roles that are not engineering work we can do. Kept narrow: these are
      titles, not topics, so a backend role at a hardware company still counts.
    phrases: ["sales representative", "account executive", "sdr", "recruiter",
              "marketing manager", "community manager", "customer support",
              "hardware engineer", "mechanical engineer", "electrical engineer",
              "firmware", "unpaid", "volunteer", "equity only", "no salary"]

# Adverts that are not adverts. A thread reply discussing the thread, or a
# moderator note, is not a company advertising.
hard_reject:
  # Not weighted, because this is not a matter of degree. An equity-only role
  # has no budget, and the entire reason for preferring hiring adverts to
  # forum posts is that the budget is stated. A co-founder hunt is the same
  # thing with a better title. Both scored "ambiguous buyer" at 0.50 until
  # they were moved here - close enough to the bar to look like thin leads,
  # which is worse than being rejected.
  #
  # "founding engineer" deliberately does NOT appear: that is a real paid
  # role and one of the better leads in the sample.
  - "equity only"
  - "equity-only"
  - "co-founder"
  - "cofounder"
  - "sweat equity"
  - "unpaid"
  - "please post"
  - "reminder:"
  - "meta:"
  - "seeking work"
  - "looking for work"
  - "seeking freelancer"

frame_phrases: []
