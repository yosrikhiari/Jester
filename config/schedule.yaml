# The schedule this machine is supposed to keep. `jester schedule apply`
# makes Task Scheduler match it; `jester doctor` reports the difference.
#
# Why a file: `install` registers one task at a time, so before this a paused
# task (disabled in Task Scheduler, as the generative loop has been since the
# 2026-10-02 quota pause) was indistinguishable from a deleted one. The pause
# lived only on one machine. It is a decision, so it belongs in the repo where
# it can be reviewed and undone.
#
# `enabled: false` is a PAUSE, not a deletion: the task stays registered with
# its cadence and launcher, so setting it back to true and re-applying restores
# exactly what was chosen.
#
# `command` is one of the schedulable commands in jester/schedule.py
# (TASK_FOR_COMMAND). `cadence` is exactly one of:
#   every: 30          -- every N minutes
#   at: "09:00"        -- daily at HH:MM local time
#   weekly: SUN        -- weekly on that day (add `at:` for the time)
# `options` are the scrape ceilings (`only`, `max_posts`, `max_comments`,
# `max_ideas`) passed to the command; ignored for `treat`, which takes none.

tasks:
  # ── the generative pipeline: paused on 2026-10-02 for quota ────────────
  # Re-enable with `enabled: true` and `jester schedule apply` when the quota
  # decision is reversed. Nothing else needs to change.
  - task: JesterNightly
    command: cycle
    cadence: {every: 30}
    enabled: false
  - task: JesterNightlyScrape
    command: ingest
    cadence: {every: 60}
    enabled: false
  - task: JesterNightlyTreat
    command: treat
    cadence: {every: 30}
    enabled: false

  # ── the signals collector: still running ───────────────────────────────
  # Times are staggered on purpose; the sweep reads Himalayas to the end of
  # its results and must not race the hiring run against the same budget.
  - task: JesterNightlySignals
    command: signals
    cadence: {at: "09:00"}
    enabled: true
  - task: JesterNightlySignalsBrief
    command: signals-brief
    cadence: {at: "10:00"}
    enabled: true
  - task: JesterNightlySignalsHiring
    command: signals-hiring
    cadence: {at: "09:30"}
    enabled: true
  - task: JesterNightlySignalsSweep
    command: signals-sweep
    # Weekly, not daily: the sweep reads every term to the end of Himalayas'
    # results (~300 requests) and the board refreshes once a day. schedule.py
    # documents the rationale as SWEEP_CADENCE, and a contract test compares
    # the two so `apply` cannot quietly multiply the request volume by seven.
    cadence: {weekly: SUN, at: "08:00"}
    enabled: true
  - task: JesterNightlyLeadsReddit
    command: leads-reddit
    cadence: {at: "09:45"}
    enabled: true

  # ── the operational jobs: a verified backup, then the privacy sweep ─────
  # Backup runs BEFORE the morning chain and verifies the snapshot it wrote,
  # so the newest copy is never older than the last write. `--keep` stays at
  # its default of 14, one per day for a fortnight.
  - task: JesterNightlyBackup
    command: backup
    cadence: {at: "02:30"}
    enabled: true
  # Retention NULLs raw_text on nuggets past the 30-day TTL, which is
  # irreversible and destroys the extraction-evaluation substrate. It stays
  # PAUSED until the evaluation sample has been drawn and labelled; flipping
  # `enabled: true` is the owner's decision, not an install side effect.
  - task: JesterNightlyRetention
    command: retention
    cadence: {weekly: SUN, at: "03:30"}
    enabled: false
