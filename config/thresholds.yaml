# Every numeric key has a documented default (see go/internal/config/config.go).
# Out-of-range values fail validation at startup.
max_comments_per_thread: 500
min_upvotes: 1
dedup_threshold: 0.87
prefilter_min_chars: 40
# Forum prose (Hacker News, Discourse) runs longer than a Reddit comment;
# 600 was tuned on Reddit alone and dropped most of it before extraction.
prefilter_max_chars: 1400
prefilter_max_emoji: 5
prefilter_max_mentions: 3
prefilter_min_words: 6
request_delay_ms: 2000
# How many threads/videos the live worker walks per source in one run.
# The fallback for any platform not listed below.
max_threads_per_source: 3
# Per-platform depth. One number cannot serve all four adapters:
#
#   hackernews  a keyless, unmetered, documented API that returns 1,000
#               stories in ONE request. Depth here is free and carries no
#               ToS question. 3 was leaving almost all of it unused.
#   discourse   public JSON API, 30 topics per page, paginated. Cheap, but
#               each page is a request, so this is paced.
#   reddit      browser scrape through cloakserve: bot detection, one
#               concurrent session, no licence key. The only platform where
#               more depth is a real risk to the identity.
#   youtube     same, plus lazy-loading makes each video slow to read.
#
# Raising the bottom two is the one change here that could get a fingerprint
# flagged; they stay where they were.
# Depth is balanced by measured YIELD, not by "where is fetching cheap".
#
# The first version of this table optimised for the latter and made corpus
# concentration WORSE. Measured comments kept per post:
#
#   hackernews   70.3      discourse  13.4      reddit  6.3      youtube  1.0
#
# At depth 40, one Hacker News turn implies 2,814 comments against a run
# budget of 1,200 — so a single HN source consumed the entire run, the
# staleness rotation never reached the other 82 sources, and HN went from 78%
# to 85% of the archive on the day 55 new sources were added.
#
# The rule now: depth x avg-yield should land near the same figure for every
# platform, so a turn at any source costs a comparable slice of the budget and
# the rotation actually rotates. Reddit and Stack Exchange stay below their
# balanced share on purpose — Reddit because more depth there is the one real
# §1201 risk, Stack Exchange because it is quota-metered.
max_threads_per_platform:
  # 3 x 70.3 = ~211
  hackernews: 3
  # Stack Exchange is sanctioned and keyless, but METERED, which none of the
  # others are. Each question costs two requests (question, then answers) plus
  # one listing per site per run, so depth 3 is 7 requests per site per run.
  # Against the keyless 300/day-per-IP quota that is already tight across six
  # sites on a 30-minute schedule. Set STACKEXCHANGE_KEY (free, no approval)
  # to raise the ceiling to 10,000/day and this can go much higher.
  # GitHub issues are nearly as dense as HN: 255 comments from 3 rclone
  # issues, ~85 each. 2 x 85 = ~170.
  #
  # It is also rate-limited: 60 core requests/hour unauthenticated, and each
  # issue costs two core requests plus one search per repo. Ten repos at this
  # depth is 50 requests — most of the hourly budget in a single run.
  # GITHUB_TOKEN (a scopeless personal access token; it authenticates the rate
  # limit, not any permission) raises the ceiling to 5,000/hour.
  github: 2
  # 12 x 13.4 = ~161
  discourse: 12
  # Deliberately BELOW its balanced share. Stack Exchange yields little per
  # question after prefiltering, so balance would argue for 20+ — but it is
  # metered at 300 requests/day keyless and each question costs two.
  # STACKEXCHANGE_KEY lifts that to 10,000/day and this can rise.
  stackexchange: 4
  # Also deliberately below balance. At 6.3 comments/post, balance would put
  # Reddit near 25 — and Reddit is the one platform where more depth is a real
  # DMCA §1201 exposure, on a stealth-browser path with no licence key. It
  # stays a minority voice by choice, which is the entire strategic point.
  #
  # Note that this number USED to be a coincidence rather than a setting. A
  # shreddit paint renders exactly three posts — not the ~25 assumed — and
  # scrolling adds none at any viewport, so the adapter returned 3 whatever
  # this said. Raising it to 10 changed nothing and nothing reported that.
  # ListThreads now pages with ?after= (three posts a page, no overlap), so
  # the number is honoured: 15 asked for is 15 returned, at the cost of five
  # navigations through the stealth browser. The value stays at 3 by choice,
  # not by ceiling.
  reddit: 3
  youtube: 2
  # Real-estate portals: browser-scraped via cloakserve, no licence key.
  # 100 listings per source per run, the sample target for M2.4.
  realestate: 100
  # EPISODES, and deliberately few. One episode is an hour of speech that
  # becomes 150-400 speaker turns after merging — an order of magnitude more
  # per unit than any thread on this list, so depth 2 already puts podcasts
  # near the top of the per-turn balance. Transcripts are also the slowest
  # fetch here: a megabyte of VTT per episode.
  podcast: 2
# Steam's depth, and it is a REVIEW count — a Steam source IS one app, so
# "threads to walk per source" has nothing to walk there and the number that
# actually varies is how many of the app's reviews come back. It gets its own
# knob rather than an entry in max_threads_per_platform, which is validated to
# [1,50] precisely because its unit is threads.
#
# The ceiling is about BALANCE, not quota: Steam is keyless and unmetered, but
# every other platform yields roughly 160-210 comments per turn, and an app
# taking max_comments_per_thread (500) would stop the rotation rotating.
# Reviews are negative-only by default, so this is 150 complaints rather than
# 150 reviews of which a handful complain.
max_reviews_per_app: 150

# Skip threads too quiet to be worth a fetch. Only the API-backed adapters
# (Hacker News, Discourse) can apply this before fetching.
min_comments_per_thread: 8
# Ceiling on nuggets per synthesis call. Groups are by thread, and one big
# Hacker News thread yields 400-700 nuggets (10k-26k prompt tokens) - over
# Groq's 8k tokens-per-minute free-tier cap, so every cycle retried the same
# 15 threads and archived 0 ideas. Bigger groups are split into chunks of this
# size, each its own idea. 40 nuggets is ~1.5-2k tokens.
max_nuggets_per_idea: 40
# Write the archive out as CSV at the end of every run, so a nightly job
# nobody watches still leaves something readable behind. Pruned by
# `jester retention` on the same §14 TTL as the archive itself.
export_after_run: true
# Rows per CSV shard: reddit/reddit-001.csv, -002.csv, … Excel stops near
# 1,048,576 rows and gets unusable long before that.
export_rows_per_file: 100000
# Seconds one Go worker run may take before it is killed; 0 uses the built-in
# default (3600). The worker walks every enabled source in ONE subprocess, so
# this has to cover the whole list: measured here, the non-real-estate sources
# take ~23 minutes and the ten real-estate portals ~13 minutes on their own,
# but the real-estate walk inside a full cycle ran 37 minutes without
# finishing. Two hours leaves headroom for a slow portal without letting a
# genuinely hung fetch sit all day.
#
# A kill no longer loses the walk: `ingest` and `cycle` export what the worker
# already wrote before they exit non-zero. Getting this number slightly wrong
# costs coverage on one tick, not data.
ingest_timeout_seconds: 7200
# M2.3/D-1 competitor web check. none = keep M2.2 behaviour (competition
# rides on the model prior); fake = deterministic offline; duckduckgo = live.
competitor_search_provider: none
embedding_provider: ollama
embedding_model: nomic-embed-text
synthesizer_provider: groq
critic_provider: groq
extractor_provider: fake
models:
  extractor: qwen3:8b
  archivist: phi4-mini:3.8b
  synthesizer: openai/gpt-oss-120b
  critic: openai/gpt-oss-120b

# Second fetch per real-estate result page, for fields the result page does not
# carry. 0 = off, which is the default and the honest one: it is ONE REQUEST
# PER LISTING on top of the result page, so a portal answering 33 tiles becomes
# 34 requests instead of 1.
#
# Only two shipped profiles declare a `detail` block, and each earned it. Houni
# publishes no price on its result tiles at all - two patterns were tried
# against them and both reported fiction - so with this off its listings are
# recorded priced nil, correctly but uselessly. Property24 puts the street
# address only on the listing page, and that is the field that separates a real
# cross-portal duplicate from two different flats sharing a price and a suburb.
#
# Set it to the number of listings per page you are willing to pay for. 20 is
# roughly "one result page's worth". Property24 answered 503 during development
# after a heavy session, which is why this is a number someone chooses.
realestate_detail_per_page: 0
